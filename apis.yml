aid: formally
name: Formally
description: 'Formally is an AI-native platform for legal collaboration that begins with US immigration.
  It combines intelligent technology, behavioral science, and secure, portable client data to connect
  immigration attorneys and law firms, individual visa applicants, and employers sponsoring global hires
  in a single connected product. Attorneys manage cases at scale, individuals track applications and
  reduce anxiety while retaining ownership of their own data, and employers coordinate visa sponsorship.
  As of this enrichment pass Formally does not publish a public developer API, SDKs, developer portal, or
  documentation surface, so this profile captures company identity and published web properties only.'
